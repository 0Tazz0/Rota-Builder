<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-m">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictorial Staff Rota Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>

    <style>
        /* Inter font */
        body {
            font-family: "Inter", sans-serif;
        }
        /* Style for the draggable items */
        .staff-card, .rota-item {
            cursor: move;
            /* Touch action none is often required by polyfills on the specific draggable items */
            touch-action: none;
        }
        /* Style for the grid cells */
        .rota-cell {
            min-height: 150px;
            position: relative; /* Required for positioning icons */
        }
        /* Style for the item *within* the grid cell */
        .rota-item {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 140px;
        }
        .rota-item .delete-item {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 14px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .rota-item:hover .delete-item {
            opacity: 1;
        }
        /* Ensure input doesn't trigger delete hover */
        .session-time-input:focus {
            outline: 2px solid theme('colors.blue.500'); /* Kept blue for light-mode rota */
        }

        /* Print-Ready Styling (A4 Portrait) */
        @media print {
            @page {
                size: A4 portrait; /* Force A4 Portrait */
                margin: 10mm; /* Small margins */
            }
            body, html {
                background-color: white !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
            /* Force background colors and images to print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            /* Hide the sidebar, header, and all buttons */
            aside, header, button, .delete-staff-btn, .delete-item, #custom-context-menu {
                display: none !important;
            }
            /* Make the main content area take up the full width */
            main {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .max-w-7xl {
                max-width: 100% !important;
                box-shadow: none !important;
                background-color: transparent !important;
                margin: 0 !important;
            }
            /* Hide the top control row except for the title dropdown */
            .flex.justify-between.items-center.mb-4 > .space-x-2 {
                display: none !important;
            }
            /* Style inputs to look like plain text */
            input.session-time-input, input#week-starting-date {
                border: none !important;
                background: transparent !important;
                box-shadow: none !important;
            }
            input::placeholder {
                color: transparent !important;
            }
            select#service-user-select {
                appearance: none !important;
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                font-size: 1.5rem !important; 
            }
            .pointer-events-none.absolute {
                display: none !important;
            }
            
            /* -- CRITICAL FIXES FOR PORTRAIT A4 -- */
            #rota-container {
                width: 100% !important;
                page-break-inside: avoid;
                box-shadow: none !important;
                border: 2px solid #ccc !important;
                margin: 0 !important;
            }
            /* Reduce cell height so all 7 days fit on one vertical page */
            .rota-cell {
                min-height: 110px !important; 
                padding: 2px !important;
            }
            .rota-item {
                min-height: 100px !important;
            }
            /* Shrink the staff images so they don't stretch the cells */
            .rota-item img {
                width: 55px !important;
                height: 55px !important;
                margin-bottom: 2px !important;
            }
            /* Shrink text slightly */
            .rota-item span {
                font-size: 0.75rem !important;
            }
            .session-time-input {
                font-size: 0.75rem !important;
                margin-top: 0 !important;
            }
            /* Make header/day text a bit more compact */
            .bg-red-800 {
                padding: 4px !important;
            }
            #day-mon, #day-tue, #day-wed, #day-thu, #day-fri, #day-sat, #day-sun {
                font-size: 1.1rem !important;
                padding: 4px !important;
            }
            
            img {
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-900 p-4 md:p-8">
    <input type="file" id="import-file-input" class="hidden" accept=".json">

    <div class="max-w-7xl mx-auto bg-gray-800 rounded-lg shadow-xl">
        
        <header class="bg-teal-600 text-white p-4 shadow-md rounded-t-lg">
            <h1 class="text-3xl font-bold text-center">Pictorial Staff Rota Builder</h1>
        </header>

        <div class="flex flex-col md:flex-row md:items-start">

            <aside class="md:sticky md:top-8 md:w-1/3 w-full bg-gray-800 p-4 border-r border-gray-700">
                <h2 class="text-2xl font-semibold mb-4 text-teal-100">Staff Library</h2>
                
                <div class="bg-gray-700 p-4 rounded-lg shadow-sm mb-6">
                    <h3 class="text-lg font-semibold mb-3 text-gray-200">Add New Staff Member</h3>
                    <div class="space-y-3">
                        <input type="text" id="staff-name" placeholder="Staff Name (e.g., Jane Doe)" class="w-full px-3 py-2 bg-gray-600 border border-gray-500 text-white placeholder-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                        
                        <div>
                            <label for="staff-image" class="block text-sm font-medium text-gray-300 mb-1">Upload Photo</label>
                            <input type="file" id="staff-image" accept="image/*" class="w-full text-sm text-gray-300
                                file:mr-4 file:py-2 file:px-4
                                file:rounded-full file:border-0
                                file:text-sm file:font-semibold
                                file:bg-teal-600 file:text-white
                                hover:file:bg-teal-700
                            ">
                        </div>
                        
                        <button id="add-staff-btn" class="w-full bg-teal-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-teal-700 transition duration-200">
                            Add Staff
                        </button>
                    </div>
                </div>

                <h3 class="text-lg font-semibold mb-3 text-gray-200">Your Staff</h3>
                <p class="text-sm text-gray-400 mb-3">(Drag staff to the rota)</p>
                <div id="staff-list" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                    </div>

                <button id="clear-library-btn" class="w-full bg-red-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-600 transition duration-200 mt-6">
                    Clear Staff Library
                </button>

                <div class="flex space-x-2 mt-4">
                    <button id="import-library-btn" class="w-full bg-teal-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-teal-600 transition duration-200">
                        Import Library
                    </button>
                    <button id="export-library-btn" class="w-full bg-cyan-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-cyan-700 transition duration-200">
                        Export Library
                    </button>
                </div>
            </aside>

            <main class="md:w-2/3 w-full p-4 md:p-6 bg-white rounded-br-lg">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center space-x-2">
                        <div class="relative">
                            <select id="service-user-select" class="text-2xl font-semibold text-gray-800 bg-white rounded-lg p-2 pr-10 border border-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
                                <option value="Caitlin">Caitlin's Weekly Rota</option>
                                <option value="Karen">Karen's Weekly Rota</option>
                                <option value="Angie">Angie's Weekly Rota</option>
                                <option value="Nadia">Nadia's Weekly Rota</option>
                                <option value="Louisa">Louisa's Weekly Rota</option>
                                <option value="Anita">Anita's Weekly Rota</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-700">
                                <svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="space-x-2">
                        <button id="clear-rota-btn" class="bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-yellow-600 transition duration-200">
                            Clear Rota
                        </button>
                        <button id="export-image-btn" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition duration-200">
                            Export as Image
                        </button>
                    </div>
                </div>

                <div id="rota-container" class="border border-gray-300 rounded-lg overflow-hidden shadow-sm">
                    
                    <div class="relative bg-red-800 border-b border-red-900 p-4">
                        <div class="absolute top-2 left-2 flex items-center">
                            <label for="week-starting-date" class="text-xs font-medium text-gray-200 mr-1.5 whitespace-nowrap">Week Starting:</label>
                            <input type="text" id="week-starting-date" placeholder="DD/MM" class="p-1 w-20 border border-gray-300 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500" aria-label="Week starting date">
                        </div>

                        <h2 id="rota-title" class="text-3xl font-bold text-center text-white"></h2>
                    </div>
                    
                    <div id="rota-grid" class="grid grid-cols-4 bg-gray-100">
                        <div class="bg-red-800 p-2 font-bold text-center border-b border-r border-gray-200 text-white">Day</div>
                        <div id="header-morning" class="bg-red-800 p-2 font-bold text-center border-b border-r border-gray-200 text-white">Morning</div>
                        <div id="header-afternoon" class="bg-red-800 p-2 font-bold text-center border-b border-r border-gray-200 text-white">Afternoon</div>
                        <div id="header-sleepin" class="bg-red-800 p-2 font-bold text-center border-b border-gray-200 text-white">
                            <span class="flex items-center justify-center text-yellow-200">
                                <span id="sleepin-text">Sleep In</span>
                                <span class="ml-1.5">🛏️😴</span>
                            </span>
                        </div>

                        <div id="day-mon" class="p-2 font-semibold border-r border-b border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Monday</div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="mon-morning"></div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="mon-afternoon"></div>
                        <div class="rota-cell bg-white border-b border-gray-200 p-1" id="mon-sleepin"></div>
                        
                        <div id="day-tue" class="p-2 font-semibold border-r border-b border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Tuesday</div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="tue-morning"></div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="tue-afternoon"></div>
                        <div class="rota-cell bg-white border-b border-gray-200 p-1" id="tue-sleepin"></div>

                        <div id="day-wed" class="p-2 font-semibold border-r border-b border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Wednesday</div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="wed-morning"></div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="wed-afternoon"></div>
                        <div class="rota-cell bg-white border-b border-gray-200 p-1" id="wed-sleepin"></div>

                        <div id="day-thu" class="p-2 font-semibold border-r border-b border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Thursday</div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="thu-morning"></div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="thu-afternoon"></div>
                        <div class="rota-cell bg-white border-b border-gray-200 p-1" id="thu-sleepin"></div>

                        <div id="day-fri" class="p-2 font-semibold border-r border-b border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Friday</div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="fri-morning"></div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="fri-afternoon"></div>
                        <div class="rota-cell bg-white border-b border-gray-200 p-1" id="fri-sleepin"></div>

                        <div id="day-sat" class="p-2 font-semibold border-r border-b border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Saturday</div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="sat-morning"></div>
                        <div class="rota-cell bg-white border-r border-b border-gray-200 p-1" id="sat-afternoon"></div>
                        <div class="rota-cell bg-white border-b border-gray-200 p-1" id="sat-sleepin"></div>

                        <div id="day-sun" class="p-2 font-semibold border-r border-gray-200 bg-red-50 text-red-900 text-xl flex items-center justify-center">Sunday</div>
                        <div class="rota-cell bg-white border-r border-gray-200 p-1" id="sun-morning"></div>
                        <div class="rota-cell bg-white border-r border-gray-200 p-1" id="sun-afternoon"></div>
                        <div class="rota-cell bg-white p-1" id="sun-sleepin"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="confirmation-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-700 rounded-lg shadow-xl p-6 w-full max-w-sm">
            <h3 id="modal-title" class="text-xl font-semibold mb-4 text-gray-100">Are you sure?</h3>
            <p id="modal-message" class="text-gray-300 mb-6">This action cannot be undone.</p>
            <div class="flex justify-end space-x-3">
                <button id="modal-cancel-btn" class="bg-gray-500 text-gray-100 font-semibold py-2 px-4 rounded-lg hover:bg-gray-600">
                    Cancel
                </button>
                <button id="modal-confirm-btn" class="bg-red-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-red-600">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <div id="custom-context-menu" class="hidden fixed bg-gray-700 border border-gray-600 rounded-lg shadow-lg z-50 py-1">
        <a id="activity-cycling" class="flex items-center px-4 py-2 text-sm text-gray-200 hover:bg-gray-600 cursor-pointer">
            <span class="w-4 h-4 mr-2 text-center">🚲</span>
            Toggle Cycling
        </a>
        <a id="activity-swimming" class="flex items-center px-4 py-2 text-sm text-gray-200 hover:bg-gray-600 cursor-pointer">
             <span class="w-4 h-4 mr-2 text-center">🏊</span>
            Toggle Swimming
        </a>
        <a id="activity-shopping" class="flex items-center px-4 py-2 text-sm text-gray-200 hover:bg-gray-600 cursor-pointer">
            <span class="w-4 h-4 mr-2 text-center">🛒</span>
            Toggle Shopping
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Touch Polyfill for Mobile/Tablet
            MobileDragDrop.polyfill({
                holdToDrag: 250
            });

            const staffList = document.getElementById('staff-list');
            const addStaffBtn = document.getElementById('add-staff-btn');
            const staffNameInput = document.getElementById('staff-name');
            const staffImageInput = document.getElementById('staff-image');
            const rotaCells = document.querySelectorAll('.rota-cell');
            const exportImageBtn = document.getElementById('export-image-btn');
            const clearRotaBtn = document.getElementById('clear-rota-btn');
            const clearLibraryBtn = document.getElementById('clear-library-btn');
            const rotaGrid = document.getElementById('rota-grid');
            
            // New Import/Export buttons
            const importFileInput = document.getElementById('import-file-input');
            const importLibraryBtn = document.getElementById('import-library-btn');
            const exportLibraryBtn = document.getElementById('export-library-btn');
            
            // New Service User elements
            const serviceUserSelector = document.getElementById('service-user-select');
            const headerMorning = document.getElementById('header-morning');
            const headerAfternoon = document.getElementById('header-afternoon');
            const headerSleepIn = document.getElementById('header-sleepin');
            const sleepInText = document.getElementById('sleepin-text'); // New element for icon

            // New Day elements for translation
            const dayMon = document.getElementById('day-mon');
            const dayTue = document.getElementById('day-tue');
            const dayWed = document.getElementById('day-wed');
            const dayThu = document.getElementById('day-thu');
            const dayFri = document.getElementById('day-fri');
            const daySat = document.getElementById('day-sat');
            const daySun = document.getElementById('day-sun');

            // New Title element
            const rotaTitle = document.getElementById('rota-title');

            // NEW: Week starting date input
            const weekStartingInput = document.getElementById('week-starting-date');

            const modal = document.getElementById('confirmation-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const modalCancelBtn = document.getElementById('modal-cancel-btn');
            const modalConfirmBtn = document.getElementById('modal-confirm-btn');

            // --- NEW: Context Menu ---
            const contextMenu = document.getElementById('custom-context-menu');
            let currentRightClickedCellId = null;
            
            // Define your built-in staff list here
            const defaultStaff = [
                {
                    id: 'staff-builtin-1',
                    name: 'Jane',
                    imageUrl: 'https://via.placeholder.com/150/14b8a6/FFFFFF?text=Jane' 
                },
                {
                    id: 'staff-builtin-2',
                    name: 'John',
                    imageUrl: 'https://via.placeholder.com/150/f59e0b/FFFFFF?text=John'
                },
                {
                    id: 'staff-builtin-3',
                    name: 'Sarah',
                    imageUrl: 'https://via.placeholder.com/150/ec4899/FFFFFF?text=Sarah'
                }
            ];

            let staffMembers = []; 
            
            // Rota data now stores an object for *all* users
            let currentServiceUser = 'Caitlin'; // Default user
            let allRotaData = {
                'Caitlin': {},
                'Karen': {},
                'Angie': {},
                'Nadia': {},
                'Louisa': {},
                'Anita': {}
            };
            let modalConfirmCallback = null;

            // --- Modal Functions ---
            function showModal(title, message, onConfirm) {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalConfirmCallback = onConfirm;
                modal.classList.remove('hidden');
                
                // Reset buttons
                modalConfirmBtn.classList.remove('hidden');
                modalCancelBtn.textContent = 'Cancel';
            }

            function hideModal() {
                modal.classList.add('hidden');
                modalConfirmCallback = null;
            }

            modalCancelBtn.addEventListener('click', hideModal);
            modalConfirmBtn.addEventListener('click', () => {
                if (modalConfirmCallback) {
                    modalConfirmCallback();
                }
                hideModal();
            });

            // --- Data Persistence ---
            function saveStaff() {
                localStorage.setItem('pictorialStaff', JSON.stringify(staffMembers));
            }

            function loadStaff() {
                const savedStaff = JSON.parse(localStorage.getItem('pictorialStaff'));
                
                // If there is saved staff, load it. Otherwise, load the built-in list.
                if (savedStaff && savedStaff.length > 0) {
                    staffMembers = savedStaff;
                } else {
                    staffMembers = [...defaultStaff];
                    saveStaff(); // Save the built-in list to storage
                }
                
                renderStaffList();
            }

            function saveRotaData() {
                // Save the entire object for all users
                localStorage.setItem('pictorialRotaData', JSON.stringify(allRotaData));
            }

            function loadRotaData() {
                const defaultData = {
                    'Caitlin': {},
                    'Karen': {},
                    'Angie': {},
                    'Nadia': {},
                    'Louisa': {}, 
                    'Anita': {}
                };
                
                const savedData = JSON.parse(localStorage.getItem('pictorialRotaData')) || {};
                
                // Merge default users with saved data so new additions are never left out
                allRotaData = { ...defaultData, ...savedData };

                // Catch and migrate any old 'Louise' data in local storage
                if (allRotaData['Louise']) {
                    allRotaData['Louisa'] = { ...allRotaData['Louise'], ...allRotaData['Louisa'] };
                    delete allRotaData['Louise'];
                    saveRotaData(); // Save the correction immediately
                }

                // Set default user and render their rota
                currentServiceUser = 'Caitlin';
                serviceUserSelector.value = currentServiceUser;
                updateTranslations(); 
                renderRotaGrid();
            }

            // --- NEW: Week Date Persistence ---
            function saveWeekDate() {
                if (weekStartingInput) { // Check if element exists
                    localStorage.setItem('pictorialRotaWeek', weekStartingInput.value);
                }
            }

            function loadWeekDate() {
                if (weekStartingInput) { // Check if element exists
                    const savedDate = localStorage.getItem('pictorialRotaWeek') || '';
                    weekStartingInput.value = savedDate;
                }
            }

            // --- Rendering Functions ---
            function renderStaffList() {
                staffList.innerHTML = '';
                staffMembers.forEach(staff => {
                    const card = document.createElement('div');
                    card.className = 'staff-card flex items-center bg-gray-700 p-2 rounded-lg shadow border border-gray-600';
                    card.setAttribute('draggable', true);
                    card.setAttribute('data-staff-id', staff.id);

                    card.innerHTML = `
                        <img src="${staff.imageUrl}" alt="${staff.name}" class="w-12 h-12 rounded-full object-cover mr-3">
                        <span class="font-medium text-gray-100 flex-1">${staff.name}</span>
                        <button class="delete-staff-btn text-red-500 hover:text-red-700 font-bold text-lg px-2" data-staff-id="${staff.id}">&times;</button>
                    `;
                    
                    card.addEventListener('dragstart', handleDragStart);
                    card.querySelector('.delete-staff-btn').addEventListener('click', handleDeleteStaff);
                    
                    staffList.appendChild(card);
                });
            }

            function renderRotaGrid() {
                rotaCells.forEach(cell => {
                    cell.innerHTML = ''; // Clear previous content
                    const cellId = cell.id;
                    
                    // Get the entry for the *current* service user
                    const userRota = allRotaData[currentServiceUser] || {};
                    const rotaEntry = userRota[cellId] || {}; 
                    
                    // --- Render Staff ---
                    if (rotaEntry.staffId) {
                        const staff = staffMembers.find(s => s.id === rotaEntry.staffId);
                        const sessionTime = rotaEntry.time || '';
                        
                        if (staff) {
                            cell.innerHTML = `
                                <div class="rota-item flex flex-col items-center justify-center bg-white p-2 rounded-lg h-full" data-cell-id="${cellId}" draggable="true">
                                    <img src="${staff.imageUrl}" alt="${staff.name}" class="w-20 h-20 md:w-28 md:h-28 rounded-full object-cover mb-2 shadow-sm">
                                    <span class="text-xs md:text-sm font-semibold text-center text-gray-700 break-words">${staff.name}</span>
                                    <input type="text" class="session-time-input w-full text-center text-sm mt-1 px-1 rounded border border-gray-300" placeholder="Add time..." value="${sessionTime}" data-cell-id="${cellId}">
                                    <div class="delete-item" title="Remove staff">&times;</div>
                                </div>
                            `;
                            
                            const rotaItem = cell.querySelector('.rota-item');

                            // Delete button listener
                            rotaItem.querySelector('.delete-item').addEventListener('click', () => {
                                if (cellId.endsWith('-sleepin')) {
                                    Object.keys(allRotaData).forEach(user => {
                                        if (allRotaData[user] && allRotaData[user][cellId]) {
                                            delete allRotaData[user][cellId].staffId; 
                                            delete allRotaData[user][cellId].time;   
                                        }
                                    });
                                } else {
                                    if(allRotaData[currentServiceUser] && allRotaData[currentServiceUser][cellId]) {
                                        delete allRotaData[currentServiceUser][cellId].staffId; 
                                        delete allRotaData[currentServiceUser][cellId].time;   
                                    }
                                }
                                saveRotaData();
                                renderRotaGrid();
                            });

                            rotaItem.addEventListener('dragstart', handleRotaItemDragStart);
                            rotaItem.addEventListener('dragend', handleRotaItemDragEnd);

                        } else {
                            if(allRotaData[currentServiceUser] && allRotaData[currentServiceUser][cellId]) {
                                delete allRotaData[currentServiceUser][cellId].staffId;
                                saveRotaData();
                            }
                        }
                    }

                    // --- NEW: Render Activity Icons ---
                    if (rotaEntry.activities) {
                        const iconContainer = document.createElement('div');
                        iconContainer.className = 'absolute bottom-3 right-2 flex flex-row-reverse space-x-1 space-x-reverse'; 

                        if (rotaEntry.activities.shopping) {
                            iconContainer.innerHTML += `
                                <span style="font-size: 45px;" title="Shopping">🛒</span>
                            `;
                        }
                        if (rotaEntry.activities.swimming) {
                            iconContainer.innerHTML += `
                                <span style="font-size: 45px;" title="Swimming">🏊</span>
                            `;
                        }
                        if (rotaEntry.activities.cycling) {
                            iconContainer.innerHTML += `
                                <span style="font-size: 45px;" title="Cycling">🚲</span>
                            `;
                        }
                        cell.appendChild(iconContainer);
                    }
                });
            }

            // --- Event Handlers ---
            function handleAddStaff() {
                const name = staffNameInput.value.trim();
                const file = staffImageInput.files[0];

                if (!name || !file) {
                    showModal('Error', 'Please provide both a name and a photo.', () => hideModal());
                    modalConfirmBtn.classList.add('hidden'); 
                    modalCancelBtn.textContent = 'OK';
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const imageUrl = e.target.result;
                    
                    const img = new Image();
                    img.onload = () => {
                        const MAX_DIMENSION = 1000; 
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_DIMENSION) {
                                height = Math.round(height * (MAX_DIMENSION / width));
                                width = MAX_DIMENSION;
                            }
                        } else {
                            if (height > MAX_DIMENSION) {
                                width = Math.round(width * (MAX_DIMENSION / height));
                                height = MAX_DIMENSION;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedImageUrl = canvas.toDataURL('image/jpeg', 1.0);

                        const newStaff = {
                            id: `staff-${Date.now()}`,
                            name: name,
                            imageUrl: compressedImageUrl 
                        };
                        staffMembers.push(newStaff);
                        
                        try {
                            saveStaff();
                        } catch (saveError) {
                            console.error('Error saving staff, even after compression:', saveError);
                            staffMembers.pop(); 
                            showModal('Storage Error', 'Could not save staff. Storage might be full. Try clearing the library.', () => hideModal());
                            modalConfirmBtn.classList.add('hidden');
                            modalCancelBtn.textContent = 'OK';
                            return; 
                        }
                        
                        renderStaffList();
                        
                        staffNameInput.value = '';
                        staffImageInput.value = '';
                    };
                    img.src = imageUrl; 
                };
                reader.readAsDataURL(file);
            }

            function handleDeleteStaff(e) {
                e.stopPropagation(); 
                const staffId = e.target.getAttribute('data-staff-id');
                
                showModal('Delete Staff Member?', `Are you sure you want to delete this staff member? They will be removed from the rota.`, () => {
                    staffMembers = staffMembers.filter(s => s.id !== staffId);
                    
                    Object.keys(allRotaData).forEach(user => {
                        Object.keys(allRotaData[user]).forEach(cellId => {
                            if (allRotaData[user][cellId] && allRotaData[user][cellId].staffId === staffId) {
                                delete allRotaData[user][cellId].staffId; 
                            }
                        });
                    });

                    saveStaff();
                    saveRotaData();
                    renderStaffList();
                    renderRotaGrid();
                });
            }

            function handleDragStart(e) {
                const staffCard = e.target.closest('.staff-card');
                if (!staffCard) return;

                e.dataTransfer.setData('text/plain', staffCard.getAttribute('data-staff-id'));
                e.dataTransfer.effectAllowed = 'move';
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                e.target.closest('.rota-cell').classList.add('bg-teal-100');
            }

            function handleDragLeave(e) {
                e.target.closest('.rota-cell').classList.remove('bg-teal-100');
            }

            function handleRotaItemDragStart(e) {
                e.stopPropagation(); 

                const rotaItem = e.target.closest('.rota-item');
                const sourceCellId = rotaItem.getAttribute('data-cell-id');

                if (allRotaData[currentServiceUser] && allRotaData[currentServiceUser][sourceCellId]) {
                    const staffId = allRotaData[currentServiceUser][sourceCellId].staffId;
                    e.dataTransfer.setData('text/plain', staffId);
                }
                
                e.dataTransfer.setData('source-cell', sourceCellId);
                e.dataTransfer.effectAllowed = 'move';
                
                setTimeout(() => {
                    rotaItem.classList.add('opacity-20');
                }, 0);
            }

            function handleRotaItemDragEnd(e) {
                e.stopPropagation();
                const items = document.querySelectorAll('.rota-item');
                items.forEach(item => item.classList.remove('opacity-20'));
            }

            function handleDrop(e) {
                e.preventDefault();
                const cell = e.target.closest('.rota-cell');
                if (!cell) return;
                
                cell.classList.remove('bg-teal-100'); 

                const sourceCellId = e.dataTransfer.getData('source-cell');
                const targetCellId = cell.id;

                if (sourceCellId) {
                    if (sourceCellId === targetCellId) return; 

                    const sourceIsSleepIn = sourceCellId.endsWith('-sleepin');
                    const targetIsSleepIn = targetCellId.endsWith('-sleepin');
                    
                    const usersToUpdate = (sourceIsSleepIn || targetIsSleepIn) ? Object.keys(allRotaData) : [currentServiceUser];

                    for (const user of usersToUpdate) {
                        if (!allRotaData[user]) allRotaData[user] = {};

                        const sourceData = allRotaData[user][sourceCellId] ? { ...allRotaData[user][sourceCellId] } : undefined;
                        const targetData = allRotaData[user][targetCellId] ? { ...allRotaData[user][targetCellId] } : undefined;
                        
                        if (sourceData) {
                            allRotaData[user][targetCellId] = sourceData;
                        } else {
                            delete allRotaData[user][targetCellId];
                        }
                        
                        if (targetData) {
                            allRotaData[user][sourceCellId] = targetData; 
                        } else {
                            delete allRotaData[user][sourceCellId]; 
                        }
                    }
                    
                } else {
                    const staffId = e.dataTransfer.getData('text/plain');
                    
                    const getExistingActivities = (user, cId) => {
                        if (!allRotaData[user]) allRotaData[user] = {};
                        if (!allRotaData[user][cId]) allRotaData[user][cId] = {};
                        return allRotaData[user][cId].activities || {};
                    };

                    if (targetCellId.endsWith('-sleepin')) {
                        Object.keys(allRotaData).forEach(user => {
                            const activities = getExistingActivities(user, targetCellId);
                            allRotaData[user][targetCellId] = { staffId: staffId, time: '', activities: activities }; 
                        });
                    } else {
                        const activities = getExistingActivities(currentServiceUser, targetCellId);
                        allRotaData[currentServiceUser][targetCellId] = { staffId: staffId, time: '', activities: activities };
                    }
                }

                saveRotaData();
                renderRotaGrid();
            }

            function handleSaveTime(e) {
                if (e.target.classList.contains('session-time-input')) {
                    const cellId = e.target.getAttribute('data-cell-id');
                    const time = e.target.value.trim();
                    
                    const ensureDataPath = (user, cId) => {
                        if (!allRotaData[user]) allRotaData[user] = {};
                        if (!allRotaData[user][cId]) allRotaData[user][cId] = { activities: {} };
                    };

                    if (cellId.endsWith('-sleepin')) {
                        Object.keys(allRotaData).forEach(user => {
                            ensureDataPath(user, cellId);
                            if (allRotaData[user][cellId] && allRotaData[user][cellId].staffId) { 
                                allRotaData[user][cellId].time = time;
                            }
                        });
                    } else {
                        ensureDataPath(currentServiceUser, cellId);
                        if (allRotaData[currentServiceUser] && allRotaData[currentServiceUser][cellId] && allRotaData[currentServiceUser][cellId].staffId) {
                            allRotaData[currentServiceUser][cellId].time = time;
                        }
                    }
                    saveRotaData();
                }
            }

            function handleExportImage() {
                const btn = exportImageBtn;
                const targetElement = document.getElementById('rota-container'); 

                if (typeof html2canvas === 'undefined') {
                    showModal('Error', 'Library not loaded. Please wait a moment and try again.', () => hideModal());
                    modalConfirmBtn.classList.add('hidden');
                    modalCancelBtn.textContent = 'OK';
                    return;
                }

                btn.textContent = 'Generating...';
                btn.disabled = true;
                
                window.scrollTo(0, 0);
                
                html2canvas(targetElement, { 
                    scale: 2, 
                    onclone: (doc) => {
                        const inputs = doc.querySelectorAll('.session-time-input');
                        inputs.forEach(input => {
                            const span = doc.createElement('span');
                            span.textContent = input.value;
                            span.className = 'w-full text-center text-sm mt-1 px-1'; 
                            input.parentNode.replaceChild(span, input);
                        });
                        
                        const dateInput = doc.getElementById('week-starting-date');
                        if (dateInput) {
                            const dateSpan = doc.createElement('span');
                            dateSpan.textContent = dateInput.value;
                            dateSpan.className = 'p-1 text-sm text-white'; 
                            dateInput.parentNode.replaceChild(dateSpan, dateInput);
                        }
                    }
                }).then(canvas => {
                    if (canvas.width === 0 || canvas.height === 0) {
                        throw new Error('Canvas generation failed. Dimensions were 0.');
                    }
                    
                    const imgData = canvas.toDataURL('image/png');
                    const dateValue = weekStartingInput.value.trim(); 
                    const dateString = dateValue ? dateValue.replace(/[\/\\]/g, '-') : 'no-date';
                    
                    const link = document.createElement('a');
                    link.href = imgData;
                    link.download = `rota-${currentServiceUser}-${dateString}.png`;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    btn.textContent = 'Export as Image';
                    btn.disabled = false;
                }).catch(err => {
                    console.error('Error exporting image:', err);
                    showModal('Error', 'Could not generate image. Please try again.', () => hideModal());
                    modalConfirmBtn.classList.add('hidden');
                    modalCancelBtn.textContent = 'OK';
                    btn.textContent = 'Export as Image';
                    btn.disabled = false;
                });
            }

            function handleClearRota() {
                showModal('Clear All Rotas?', `Are you sure you want to clear the entire rota grid for ALL service users? This will remove all staff, times, and activities.`, () => {
                    allRotaData = {
                        'Caitlin': {},
                        'Karen': {},
                        'Angie': {},
                        'Nadia': {},
                        'Louisa': {}, 
                        'Anita': {}
                    };
                    saveRotaData();
                    renderRotaGrid();
                });
            }

            function handleClearStaff() {
                showModal('Clear Staff Library?', 'Are you sure you want to reset ALL staff to the default list? This will also clear ALL user rotas.', () => {
                    staffMembers = [...defaultStaff]; 
                    allRotaData = {
                        'Caitlin': {},
                        'Karen': {},
                        'Angie': {},
                        'Nadia': {},
                        'Louisa': {}, 
                        'Anita': {}
                    };
                    saveStaff();
                    saveRotaData();
                    
                    if (weekStartingInput) {
                        weekStartingInput.value = '';
                        saveWeekDate();
                    }

                    renderStaffList();
                    renderRotaGrid();
                });
            }

            function handleExportLibrary() {
                if (staffMembers.length === 0) {
                    showModal('Export Error', 'Your staff library is empty.', () => hideModal());
                    modalConfirmBtn.classList.add('hidden');
                    modalCancelBtn.textContent = 'OK';
                    return;
                }
                
                const dataStr = JSON.stringify(staffMembers, null, 2); 
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = 'staff-library-backup.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

            function handleImportLibrary(e) {
                const file = e.target.files[0];
                if (!file) {
                    return; 
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedStaff = JSON.parse(event.target.result);

                        if (!Array.isArray(importedStaff) || !importedStaff.every(s => s.id && s.name && s.imageUrl)) {
                            throw new Error('Invalid file format.');
                        }

                        showModal('Import Library?', 'This will overwrite your current staff library and clear ALL user rotas. Are you sure?', () => {
                            staffMembers = importedStaff;
                            allRotaData = {
                                'Caitlin': {},
                                'Karen': {},
                                'Angie': {},
                                'Nadia': {},
                                'Louisa': {}, 
                                'Anita': {}
                            };
                            saveStaff();
                            saveRotaData();
                            renderStaffList();
                            renderRotaGrid();
                        });

                    } catch (err) {
                        console.error('Error importing file:', err);
                        showModal('Import Error', 'Could not import file. It may be corrupt or not a valid library backup.', () => hideModal());
                        modalConfirmBtn.classList.add('hidden');
                    modalCancelBtn.textContent = 'OK';
                    } finally {
                        importFileInput.value = null;
                    }
                };
                reader.readAsText(file);
            }

            function updateTranslations() {
                const selectedOptionText = serviceUserSelector.options[serviceUserSelector.selectedIndex].text;
                rotaTitle.textContent = selectedOptionText;

                if (currentServiceUser === 'Nadia') {
                    headerMorning.textContent = 'Manhã';
                    headerAfternoon.textContent = 'Tarde';
                    sleepInText.textContent = 'Pernoite'; 
                    dayMon.textContent = 'Segunda-feira';
                    dayTue.textContent = 'Terça-feira';
                    dayWed.textContent = 'Quarta-feira';
                    dayThu.textContent = 'Quinta-feira';
                    dayFri.textContent = 'Sexta-feira';
                    daySat.textContent = 'Sábado';
                    daySun.textContent = 'Domingo';
                } else {
                    headerMorning.textContent = 'Morning';
                    headerAfternoon.textContent = 'Afternoon';
                    sleepInText.textContent = 'Sleep In'; 
                    dayMon.textContent = 'Monday';
                    dayTue.textContent = 'Tuesday';
                    dayWed.textContent = 'Wednesday';
                    dayThu.textContent = 'Thursday';
                    dayFri.textContent = 'Friday';
                    daySat.textContent = 'Saturday';
                    daySun.textContent = 'Sunday';
                }
            }

            function handleUserChange(e) {
                currentServiceUser = e.target.value;
                updateTranslations(); 
                renderRotaGrid(); 
            }

            function handleRightClick(e) {
                e.preventDefault(); 
                const cell = e.target.closest('.rota-cell');
                if (!cell) return;

                currentRightClickedCellId = cell.id;
                
                contextMenu.style.left = `${e.clientX}px`;
                contextMenu.style.top = `${e.clientY}px`;
                contextMenu.classList.remove('hidden');
            }

            function hideContextMenu() {
                contextMenu.classList.add('hidden');
                currentRightClickedCellId = null;
            }

            function toggleActivity(activityType) {
                if (!currentRightClickedCellId) return;

                const cellId = currentRightClickedCellId;
                
                if (!allRotaData[currentServiceUser]) allRotaData[currentServiceUser] = {};
                if (!allRotaData[currentServiceUser][cellId]) {
                    allRotaData[currentServiceUser][cellId] = { staffId: null, time: '', activities: {} };
                }
                if (!allRotaData[currentServiceUser][cellId].activities) {
                    allRotaData[currentServiceUser][cellId].activities = {};
                }
                
                allRotaData[currentServiceUser][cellId].activities[activityType] = !allRotaData[currentServiceUser][cellId].activities[activityType];
                
                saveRotaData();
                renderRotaGrid();
            }

            addStaffBtn.addEventListener('click', handleAddStaff);
            exportImageBtn.addEventListener('click', handleExportImage);
            clearRotaBtn.addEventListener('click', handleClearRota);
            clearLibraryBtn.addEventListener('click', handleClearStaff);
            
            importLibraryBtn.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', handleImportLibrary);
            exportLibraryBtn.addEventListener('click', () => handleExportLibrary);

            serviceUserSelector.addEventListener('change', handleUserChange);

            if (weekStartingInput) {
                weekStartingInput.addEventListener('input', saveWeekDate);
            }

            rotaGrid.addEventListener('blur', handleSaveTime, true);

            rotaCells.forEach(cell => {
                cell.addEventListener('dragover', handleDragOver);
                cell.addEventListener('dragleave', handleDragLeave);
                cell.addEventListener('drop', handleDrop);
                cell.addEventListener('contextmenu', handleRightClick); 
            });

            document.addEventListener('click', hideContextMenu); 
            document.addEventListener('scroll', hideContextMenu, true); 
            document.getElementById('activity-cycling').addEventListener('click', () => toggleActivity('cycling'));
            document.getElementById('activity-swimming').addEventListener('click', () => toggleActivity('swimming'));
            document.getElementById('activity-shopping').addEventListener('click', () => toggleActivity('shopping'));

            loadStaff();
            loadRotaData();
            loadWeekDate(); 
        });
    </script>
</body>
</html>
